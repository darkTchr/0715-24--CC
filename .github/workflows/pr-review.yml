# PR Review — 代码审查流水线
# 触发: PR opened/synchronize/reopened → master/main/develop
# 验收: 审查结果作为评论发布，高危问题阻止合并

name: PR Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main, develop]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ===== Claude AI 代码审查（始终运行，无需项目依赖） =====
  claude-review:
    name: Claude AI Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate PR Diff
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr_diff.txt
          echo "DIFF_SIZE=$(wc -l < /tmp/pr_diff.txt)" >> $GITHUB_ENV

      - name: Claude Code Review
        if: env.DIFF_SIZE > 0
        run: node scripts/ci/claude-review.js /tmp/pr_diff.txt /tmp/review-result.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEKSEEK_API_KEY }}

      - name: Post Review Comment
        if: always()
        run: node scripts/ci/post-comment.js /tmp/review-result.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # ===== 构建检查（有 package.json 时运行） =====
  check:
    name: Project Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project type
        id: check
        run: |
          if [ -f "package.json" ]; then
            echo "HAS_PACKAGE=true" >> $GITHUB_OUTPUT
          else
            echo "HAS_PACKAGE=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip (no package.json)
        if: steps.check.outputs.HAS_PACKAGE == 'false'
        run: echo "项目尚未初始化，跳过依赖检查"

      - uses: actions/setup-node@v4
        if: steps.check.outputs.HAS_PACKAGE == 'true'
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install & Check
        if: steps.check.outputs.HAS_PACKAGE == 'true'
        run: |
          npm ci
          npm run lint 2>/dev/null || echo "lint skipped"
          npx tsc --noEmit 2>/dev/null || echo "typecheck skipped"
          npm test 2>/dev/null || echo "test skipped"
          npm run build 2>/dev/null || echo "build skipped"
