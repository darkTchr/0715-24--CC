# Security Scan — 安全扫描流水线
# 触发: PR 涉及源码/依赖变更 + 每周定时扫描

name: Security Scan

on:
  pull_request:
    branches: [master, main, develop]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '**.js'
      - '**.ts'
      - '**.tsx'
  schedule:
    - cron: '0 18 * * 1'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  # ===== 密钥检测 =====
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for hardcoded secrets
        run: |
          echo "=== 扫描硬编码密钥 ==="
          PATTERNS=(
            "sk-[a-zA-Z0-9]{32,}"
            "AIza[0-9A-Za-z_-]{35}"
            "-----BEGIN.*PRIVATE KEY-----"
            "ghp_[a-zA-Z0-9]{36}"
            "gho_[a-zA-Z0-9]{36}"
            "xox[baprs]-[a-zA-Z0-9]{10,}"
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(grep -rInE "$pattern" . --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.yml" --include="*.yaml" --exclude-dir=.git --exclude-dir=node_modules 2>/dev/null || true)
            if [ -n "$MATCHES" ]; then
              echo "::warning::疑似密钥: $MATCHES"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            echo "::error::代码中存在疑似硬编码密钥"
            exit 1
          fi
          echo "✅ 密钥检测通过"

  # ===== Claude AI 安全审查（有 DeepSeek Key 时运行） =====
  claude-security:
    name: AI Security Review
    runs-on: ubuntu-latest
    needs: secret-scan
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect Changed Files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(ts|tsx|js|jsx)$' > /tmp/changed_files.txt || echo "." > /tmp/changed_files.txt
          else
            find . -name "*.ts" -o -name "*.tsx" -o -name "*.js" -o -name "*.jsx" | grep -v node_modules | grep -v .git > /tmp/changed_files.txt || echo "." > /tmp/changed_files.txt
          fi

      - name: Claude Security Analysis
        run: node scripts/ci/security-review.js /tmp/changed_files.txt /tmp/audit-result.json /tmp/claude-security.json
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      - name: Post Security Report
        if: always()
        run: node scripts/ci/post-security-report.js /tmp/audit-result.json /tmp/claude-security.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
